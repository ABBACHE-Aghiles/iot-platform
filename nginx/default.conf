# Reverse proxy non-root (nginx-unprivileged, port 8081 > 1024) devant l'API + hébergement du dashboard React.
server {
    listen 8081;
    server_name _;

    # Dashboard React (fichiers statiques pré-construits dans dashboard/dist)
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Flux Server-Sent Events : pas de buffering, connexion longue
    location = /api/stream {
        proxy_pass http://service-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # API REST
    location /api/ {
        proxy_pass http://service-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://service-api:3001;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
